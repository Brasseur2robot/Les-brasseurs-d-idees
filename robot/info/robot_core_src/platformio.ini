[env:dfrobot_firebeetle2_esp32e]
platform = espressif32
board = dfrobot_firebeetle2_esp32e
framework = arduino
lib_deps = 
	dfrobot/DFRobotDFPlayerMini@^1.0.6
	robotis-git/Dynamixel2Arduino@^0.8.1
	adafruit/Adafruit AS726X@^1.2.3
	adafruit/Adafruit AW9523@^1.0.5
	adafruit/Adafruit NeoPixel@^1.15.5
	schnoog/VL53L0X_mod@^1.0.1
	madhephaestus/ESP32Encoder@^5.0.0
	bblanchon/ArduinoJson@^7.2.2
	tbekas/BLE-Gamepad-Client@^0.9.0
	madhephaestus/ESP32Servo@^3.2.1
	forntoh/LcdMenu@^5.13.0
	adafruit/Adafruit PWM Servo Driver Library@^3.0.3
	dfrobot/DFRobot_RGBLCD1602@^2.0.1
	marcoschwartz/LiquidCrystal_I2C@^1.1.4
	mprograms/SimpleRotary@^1.1.3
monitor_speed = 1000000
board_build.flash_mode = qio
